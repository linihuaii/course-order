server:
  port: ${PORT:8080}
  error:
    include-message: always
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/kexu?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${DB_USER:kexu}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
app:
  admin-user: ${ADMIN_USER:}
  admin-password: ${ADMIN_PASSWORD:}
  ai-url: ${AI_URL:}
  ai-key: ${AI_KEY:}
  ai-model: ${AI_MODEL:}
  ai-allowed-hosts: ${AI_ALLOWED_HOSTS:api.openai.com,api.deepseek.com,dashscope.aliyuncs.com,api.moonshot.cn,open.bigmodel.cn}
